name: Publish to JetBrains Marketplace

# Tagging `v0.2.0` publishes, provided the tag matches the version in build.gradle.kts.
# Use the manual trigger with "dry run" to exercise the whole pipeline without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Marketplace release channel"
        type: choice
        options: [default, eap]
        default: default
      dry-run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read

# a half-finished upload is worse than a late one, so never cancel a run in progress
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The version lives in build.gradle.kts and the Marketplace rejects a re-upload of an
      # existing version, so a tag that disagrees with it is a mistake worth catching before
      # the IDE downloads start.
      - name: Check the tag matches the declared plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(sed -nE 's/^version = "(.+)"$/\1/p' build.gradle.kts)
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=$declared tagged=$tagged"
          if [ -z "$declared" ]; then
            echo "::error::could not read the version out of build.gradle.kts"
            exit 1
          fi
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in build.gradle.kts"
            exit 1
          fi

      - name: Test
        run: ./gradlew test

      # Downloads the IDEs named in pluginVerification.ides, so this is the slow step.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Build
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish
        if: ${{ inputs.dry-run != true }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN is not set. Create a permanent token at"
            echo "::error::https://plugins.jetbrains.com/author/me/tokens then run:"
            echo "::error::gh secret set PUBLISH_TOKEN"
            exit 1
          fi
          ./gradlew publishPlugin -PpublishChannel=${{ inputs.channel || 'default' }}
