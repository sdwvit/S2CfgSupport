name: Publish to JetBrains Marketplace

# Tagging `v0.2.0` publishes, provided the tag matches the version in build.gradle.kts.
# Use the manual trigger with "dry run" to exercise everything except the upload.
#
# The Marketplace token is an environment secret on `marketplace`, not a repository secret, so it
# is unreachable from any other workflow or job in this repo. That environment requires a review
# from @sdwvit and accepts deployments only from `v*` tags, which means an upload cannot happen
# without a human approving that specific run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Marketplace release channel"
        type: choice
        options: [default, eap]
        default: default
      dry-run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: false

# The publish job needs `deployments` to enter the gated environment and no write access at all;
# only the release job that follows it writes to repository contents, and it never sees the token.
permissions:
  contents: read

# a half-finished upload is worse than a late one, so never cancel a run in progress
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs: a moved tag on any of them would otherwise run
# unreviewed code in a job that can reach the token.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # The version lives in build.gradle.kts and the Marketplace rejects a re-upload of an
      # existing version, so a tag that disagrees with it is a mistake worth catching before
      # the IDE downloads start.
      - name: Check the tag matches the declared plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(sed -nE 's/^version = "(.+)"$/\1/p' build.gradle.kts)
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=$declared tagged=$tagged"
          if [ -z "$declared" ]; then
            echo "::error::could not read the version out of build.gradle.kts"
            exit 1
          fi
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in build.gradle.kts"
            exit 1
          fi

      - name: Test
        run: ./gradlew test

      # Downloads the IDEs named in pluginVerification.ides, so this is the slow step.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      # A test that passes locally can still fail here, so keep the reports reachable.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # the approval gate, and the only place the token exists
    environment:
      name: marketplace
      url: https://plugins.jetbrains.com/plugin/33872-stalker-2-cfg-support

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN is not set on the marketplace environment. Create a"
            echo "::error::permanent token at https://plugins.jetbrains.com/author/me/tokens then:"
            echo "::error::gh secret set PUBLISH_TOKEN --env marketplace"
            exit 1
          fi
          ./gradlew publishPlugin -PpublishChannel=${{ inputs.channel || 'default' }}

  # A Marketplace upload leaves nothing behind on GitHub, so the tag alone would not say what
  # shipped. This mirrors it to https://github.com/sdwvit/S2CfgSupport/releases, with the same
  # notes the Marketplace shows and the exact zip that was uploaded — the artifact the build job
  # produced, not a rebuild. It runs only after a successful publish, so a release page always
  # means the plugin really shipped.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # the one job allowed to write, and the only one with no access to the publish token
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-distribution
          path: dist

      # changeNotes in build.gradle.kts is the single source of truth for what a version changed,
      # so the release body is cut out of it rather than written twice. GitHub renders the HTML.
      - name: Take this version's notes out of build.gradle.kts
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY' > notes.html
          import re, sys
          version = sys.argv[1]
          text = open("build.gradle.kts").read()
          section = re.search(
              rf"<h4>{re.escape(version)}</h4>(.*?)(?=<h4>|\"\"\")",
              text,
              re.S,
          )
          if not section:
              sys.exit(f"::error::no <h4>{version}</h4> section in the changeNotes")
          print(section.group(1).strip())
          PY
          cat notes.html

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.html \
            --verify-tag
